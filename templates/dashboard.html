<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stress Monitor Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .btn-live {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.3s;
        }

        .btn-live:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .sessions-list {
            display: grid;
            gap: 15px;
        }

        .session-card {
            background: #f9f9f9;
            border-left: 5px solid #667eea;
            padding: 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .session-card:hover {
            background: #f0f0f0;
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }

        .session-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .session-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        .session-date {
            color: #999;
            font-size: 14px;
        }

        .session-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
        }

        .stat {
            background: white;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-label {
            color: #999;
            font-size: 12px;
            text-transform: uppercase;
        }

        .stat-value {
            color: #333;
            font-size: 24px;
            font-weight: bold;
            margin-top: 5px;
        }

        .no-sessions {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .chart-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            padding: 20px;
        }

        .chart-container.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chart-modal {
            background: white;
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 1000px;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover {
            background: #c0392b;
        }

        #detailChart {
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>❤️ Stress Monitor History</h1>
                <p style="color: #999; margin-top: 5px;">View your recorded sessions</p>
            </div>
            <a href="/api/live" class="btn-live">📊 Start Live Monitoring</a>
        </div>

        <div class="sessions-list" id="sessionsList">
            <div class="no-sessions">
                <p>No sessions recorded yet.</p>
                <p>Start a new session to see your data here!</p>
            </div>
        </div>
    </div>

    <div class="chart-container" id="chartModal">
        <div class="chart-modal">
            <button class="close-btn" onclick="closeChart()">&times;</button>
            <h2 id="sessionTitle">Session Details</h2>
            <div style="position: relative; height: 400px; margin-top: 20px;">
                <canvas id="detailChart"></canvas>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        let detailChart = null;

        // Same thresholds as the live dashboard: stress is a 0-100 score
        // where HIGHER means MORE stressed (it's derived from RMSSD, where
        // lower beat-to-beat variability = more stress).
        function stressColor(score) {
            if (score > 70) return '#e74c3c';  // high
            if (score > 40) return '#f39c12';  // medium
            return '#2ecc71';                  // ok/relaxed
        }

        function loadSessions() {
            fetch('/api/sessions')
                .then(r => r.json())
                .then(sessions => {
                    const container = document.getElementById('sessionsList');

                    if (sessions.length === 0) {
                        container.innerHTML = '<div class="no-sessions"><p>No sessions recorded yet.</p></div>';
                        return;
                    }

                    container.innerHTML = sessions.map(session => `
                        <div class="session-card" onclick="showSessionDetail(${session.id})">
                            <div class="session-header">
                                <span class="session-title">Session ${session.id}</span>
                                <span class="session-date">${new Date(session.timestamp).toLocaleString()}</span>
                            </div>
                            <div class="session-stats">
                                <div class="stat">
                                    <div class="stat-label">BPM</div>
                                    <div class="stat-value">${session.avg_bpm}</div>
                                </div>
                                <div class="stat">
                                    <div class="stat-label">SpO2</div>
                                    <div class="stat-value">${session.avg_spo2}%</div>
                                </div>
                                <div class="stat">
                                    <div class="stat-label">Stress</div>
                                    <div class="stat-value" style="color: ${stressColor(session.avg_stress)}">${session.avg_stress.toFixed(0)}</div>
                                </div>
                            </div>
                        </div>
                    `).join('');
                });
        }

        function showSessionDetail(sessionId) {
            fetch(`/api/session/${sessionId}`)
                .then(r => r.json())
                .then(data => {
                    const ctx = document.getElementById('detailChart').getContext('2d');

                    if (detailChart) detailChart.destroy();

                    detailChart = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: data.labels,
                            datasets: [
                                {
                                    label: 'BPM',
                                    data: data.bpm,
                                    borderColor: '#e74c3c',
                                    backgroundColor: 'rgba(231, 76, 60, 0.1)',
                                    borderWidth: 2,
                                    tension: 0.4,
                                    yAxisID: 'y'
                                },
                                {
                                    label: 'SpO2 (%)',
                                    data: data.spo2,
                                    borderColor: '#3498db',
                                    backgroundColor: 'rgba(52, 152, 219, 0.1)',
                                    borderWidth: 2,
                                    tension: 0.4,
                                    yAxisID: 'y1'
                                },
                                {
                                    label: 'Stress Score (0-100)',
                                    data: data.stress,
                                    borderColor: '#f39c12',
                                    backgroundColor: 'rgba(243, 156, 18, 0.1)',
                                    borderWidth: 2,
                                    tension: 0.4,
                                    yAxisID: 'y2'
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                y: {
                                    type: 'linear',
                                    display: true,
                                    position: 'left',
                                    title: { display: true, text: 'BPM' }
                                },
                                y1: {
                                    type: 'linear',
                                    display: true,
                                    position: 'center',
                                    title: { display: true, text: 'SpO2 (%)' }
                                },
                                y2: {
                                    type: 'linear',
                                    display: true,
                                    position: 'right',
                                    min: 0,
                                    max: 100,
                                    title: { display: true, text: 'Stress Score (0-100)' }
                                }
                            }
                        }
                    });

                    document.getElementById('sessionTitle').textContent = `Session ${sessionId} Details`;
                    document.getElementById('chartModal').classList.add('active');
                });
        }

        function closeChart() {
            document.getElementById('chartModal').classList.remove('active');
            if (detailChart) detailChart.destroy();
        }

        // Load sessions on page load
        loadSessions();
    </script>
</body>

</html>
